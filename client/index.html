<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CryptoMessenger - E2EE Secure Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-full flex flex-col m-0 p-0">

    <!-- En-tête -->
    <header class="bg-gray-800 p-3 border-b border-gray-700 flex justify-between items-center shrink-0">
        <h1 class="text-base sm:text-lg font-bold text-green-400">🔒 CryptoMessenger</h1>
        <span id="user-status" class="text-xs sm:text-sm text-gray-400">Non connecté</span>
    </header>

    <!-- Corps principal -->
    <main class="flex flex-col md:flex-row flex-1 overflow-hidden w-full">
        
        <!-- Barre latérale (Connexion & Utilisateurs) -->
        <aside class="w-full md:w-1/3 lg:w-1/4 bg-gray-800 border-r border-gray-700 p-3 flex flex-col shrink-0 max-h-36 md:max-h-none overflow-y-auto">
            <div id="login-section" class="mb-2">
                <h2 class="text-xs sm:text-sm font-semibold mb-1">Connexion</h2>
                <input type="text" id="username-input" placeholder="Votre pseudo..." class="w-full p-2 text-sm rounded bg-gray-700 border border-gray-600 mb-1 text-white">
                <button id="login-btn" class="w-full bg-green-600 hover:bg-green-700 p-2 text-sm rounded font-semibold">Rejoindre</button>
            </div>
            
            <h2 class="text-xs sm:text-sm font-semibold mb-1 mt-1">Utilisateurs en ligne</h2>
            <ul id="users-list" class="space-y-1"></ul>
        </aside>

        <!-- Section de Discussion -->
        <section class="flex-1 flex flex-col bg-gray-900 p-3 overflow-hidden min-h-0">
            <div id="chat-header" class="text-xs sm:text-sm text-gray-400 mb-2 pb-1 border-b border-gray-800 shrink-0">
                Sélectionnez un utilisateur pour commencer.
            </div>
            
            <!-- Messages (Zone scrollable) -->
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 mb-2 p-2 bg-gray-800 rounded text-sm"></div>
            
            <!-- Zone de saisie (Toujours fixée en bas) -->
            <div id="input-section" class="flex gap-2 shrink-0 hidden mt-auto pt-2">
                <input type="text" id="message-input" placeholder="Écrire un message chiffré..." class="flex-1 p-2 text-sm rounded bg-gray-700 border border-gray-600 text-white">
                <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 text-sm rounded font-semibold">Envoyer</button>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
