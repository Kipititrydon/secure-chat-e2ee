<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoMessenger - E2EE Secure Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col">

    <header class="bg-gray-800 p-4 border-b border-gray-700 flex justify-between items-center">
        <h1 class="text-xl font-bold text-green-400">🔒 CryptoMessenger</h1>
        <span id="user-status" class="text-sm text-gray-400">Non connecté</span>
    </header>

    <main class="flex flex-1 overflow-hidden">
        <aside class="w-1/4 bg-gray-800 border-r border-gray-700 p-4 flex flex-col">
            <div id="login-section" class="mb-4">
                <h2 class="text-md font-semibold mb-2">Connexion</h2>
                <input type="text" id="username-input" placeholder="Votre pseudo..." class="w-full p-2 rounded bg-gray-700 border border-gray-600 mb-2 text-white">
                <button id="login-btn" class="w-full bg-green-600 hover:bg-green-700 p-2 rounded font-semibold">Rejoindre</button>
            </div>
            
            <h2 class="text-md font-semibold mb-2 mt-4">Utilisateurs en ligne</h2>
            <ul id="users-list" class="overflow-y-auto flex-1 space-y-2"></ul>
        </aside>

        <section class="flex-1 flex flex-col bg-gray-900 p-4">
            <div id="chat-header" class="text-sm text-gray-400 mb-2 pb-2 border-b border-gray-800">
                Sélectionnez un utilisateur pour commencer à discuter de manière chiffrée.
            </div>
            <div id="chat-messages" class="flex-1 overflow-y-auto space-y-3 mb-4 p-2 bg-gray-800 rounded"></div>
            <div id="input-section" class="flex gap-2 hidden">
                <input type="text" id="message-input" placeholder="Écrire un message chiffré..." class="flex-1 p-2 rounded bg-gray-700 border border-gray-600 text-white">
                <button id="send-btn" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded font-semibold">Envoyer</button>
            </div>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
